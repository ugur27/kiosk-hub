<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Corporate Kiosk</title>
    <!-- Tailwind CSS voor snelle styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* --- STYLING & ANIMATIES --- */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
        
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            overflow: hidden; background: #000; 
            font-family: 'Inter', sans-serif; color: white;
        }

        /* Scene Container & Transities */
        #scene-host { position: absolute; inset: 0; background: #000; }

        .scene { 
            position: absolute; inset: 0; opacity: 0; 
            transition: opacity 1.0s ease-in-out; /* Iets snellere transitie */
            z-index: 1; pointer-events: none;
            background: #000;
        }
        .scene.active { opacity: 1; pointer-events: auto; z-index: 2; }

        /* Content Styling */
        iframe, video { width: 100%; height: 100%; border: none; object-fit: cover; }
        
        .scene-image {
            width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Glassmorphism UI */
        .overlay { 
            position: fixed; inset: 0; z-index: 50; 
            pointer-events: none; /* Klikken gaat door de overlay heen */
            display: flex; flex-direction: column; 
            justify-content: space-between; padding: 40px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 15%, transparent 85%, rgba(0,0,0,0.8) 100%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px; padding: 16px 24px;
            box-shadow: 0 4px 30px rgba(0,0,0,0.3);
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* Ticker Balk */
        .ticker-container {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px);
            padding: 12px 0; border-top: 2px solid #3b82f6; z-index: 60;
        }

        .ticker-wrapper { overflow: hidden; white-space: nowrap; }

        .ticker-text {
            display: inline-block;
            padding-left: 100%;
            animation: ticker 35s linear infinite; /* Pas snelheid hier aan */
            font-weight: 700; font-size: 1.2rem; 
            text-transform: uppercase; letter-spacing: 1px; color: #e2e8f0;
        }

        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        /* Progress Bar */
        .progress-bar {
            position: fixed; top: 0; left: 0; height: 4px;
            background: #3b82f6; transition: width 0.1s linear; z-index: 100;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.8);
        }
    </style>
</head>
<body>

    <!-- Hier worden de slides/video's geladen -->
    <div id="scene-host"></div>

    <!-- UI Overlay -->
    <div class="overlay">
        <!-- Bovenbalk -->
        <div class="flex justify-between items-start">
            <!-- Klok & Weer -->
            <div class="glass-card flex items-center gap-6">
                <div class="text-right">
                    <div id="clock" class="text-4xl font-black tracking-tight leading-none">00:00</div>
                    <div id="date" class="text-[10px] uppercase font-bold opacity-70 mt-1 tracking-widest">Laden...</div>
                </div>
                <div class="h-10 w-px bg-white/20"></div>
                <div id="weather" class="text-xl font-medium">--°C</div>
            </div>
            
            <!-- Huidige Content Indicator -->
            <div class="glass-card flex flex-col items-end">
                <div class="text-[9px] uppercase opacity-60 font-bold tracking-widest mb-1">Nu op scherm</div>
                <div class="flex items-center gap-2">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-blue-500"></span>
                    </span>
                    <span class="text-lg font-bold tracking-tight" id="content-label">Opstarten...</span>
                </div>
            </div>
        </div>

        <!-- Branding (Linksonder) -->
        <div class="mb-14">
            <div class="glass-card inline-block border-l-4 border-l-blue-500 py-3">
                <span class="text-xs font-bold opacity-50 uppercase tracking-widest block">Corporate Hub</span>
                <span class="text-2xl font-black tracking-tight">Celik27</span>
            </div>
        </div>
    </div>

    <!-- Ticker & Progress -->
    <div class="ticker-container">
        <div class="ticker-wrapper">
            <div class="ticker-text" id="ticker-content">Configuratie laden...</div>
        </div>
    </div>
    <div class="progress-bar" id="progress"></div>

    <script>
        // --- CONFIGURATIE (PAS DIT AAN) ---
        const CONFIG = {
            // Scenes: Het script herkent zelf of het een afbeelding, video of iframe is.
            scenes: [
                { 
                    label: 'Kwartaal Resultaten', 
                    url: 'https://raw.githubusercontent.com/ugur27/kiosk-hub/refs/heads/main/Slides/Slide1.png', 
                    duration: 10 
                },
                { 
                    label: 'Live ICT Dashboard', 
                    // Gebruik de "Publish to Web" link van PowerBI voor publieke toegang
                    url: 'https://playground.powerbi.com/sampleReportEmbed', 
                    duration: 60 
                },
                { 
                    label: 'Veiligheid Campagne', 
                    url: 'https://raw.githubusercontent.com/ugur27/kiosk-hub/refs/heads/main/Slides/Slide2.png', 
                    duration: 15 
                },
                { 
                    label: 'Bedrijfsvideo', 
                    url: 'https://www.youtube.com/watch?v=-s8g4dpmW0k', 
                    duration: 45 
                }
            ],
            // De tekst onderin de balk
            ticker: "+++ NIEUWS: Welkom bij de nieuwe Smart Kiosk +++ Update: Kantine gesloten om 14:00 +++ Vergeet urenregistratie niet +++",
            // Locatie voor het weer
            location: { lat: 52.3676, lon: 4.9041, city: 'Amsterdam' }
        };

        // --- SYSTEEM LOGICA (HIERONDER NIETS AANPASSEN TENZIJ NODIG) ---
        let currentIdx = -1;
        let sceneTimer;
        let progressInterval;

        function init() {
            updateClock();
            updateWeather();
            document.getElementById('ticker-content').innerText = CONFIG.ticker;
            
            // Start loops
            setInterval(updateClock, 1000);
            setInterval(updateWeather, 600000); // Elke 10 minuten weer update
            
            nextScene();
        }

        // Slimme functie om te bepalen wat voor content de URL is
        function getContentType(url) {
            const extension = url.split('.').pop().toLowerCase();
            
            if (url.includes('youtube.com') || url.includes('youtu.be')) return 'youtube';
            if (['mp4', 'webm', 'ogg'].includes(extension)) return 'video_file';
            if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'].includes(extension)) return 'image';
            
            return 'iframe'; // Default fallback voor websites/dashboards
        }

        function nextScene() {
            currentIdx = (currentIdx + 1) % CONFIG.scenes.length;
            renderScene(CONFIG.scenes[currentIdx]);
        }

        function renderScene(scene) {
            const host = document.getElementById('scene-host');
            const type = getContentType(scene.url);
            const div = document.createElement('div');
            
            div.className = 'scene';

            // Content Generatie op basis van type
            if (type === 'image') {
                div.innerHTML = `<div class="scene-image" style="background-image: url('${scene.url}')"></div>`;
            } 
            else if (type === 'youtube') {
                // Haal ID uit URL (werkt voor watch?v= en youtu.be/)
                let vidId = '';
                if (scene.url.includes('v=')) vidId = scene.url.split('v=')[1].split('&')[0];
                else vidId = scene.url.split('/').pop();
                
                div.innerHTML = `<iframe src="https://www.youtube.com/embed/${vidId}?autoplay=1&mute=1&controls=0&loop=1&playlist=${vidId}&rel=0" allow="autoplay; encrypted-media"></iframe>`;
            } 
            else if (type === 'video_file') {
                div.innerHTML = `<video src="${scene.url}" autoplay muted loop playsinline class="w-full h-full object-cover"></video>`;
            } 
            else {
                // Iframe (PowerBI etc)
                div.innerHTML = `<iframe src="${scene.url}" allowFullScreen="true" sandbox="allow-scripts allow-same-origin allow-popups allow-forms"></iframe>`;
            }

            // Oude scene opruimen
            const oldScene = host.querySelector('.scene.active');
            if(oldScene) {
                oldScene.classList.remove('active');
                setTimeout(() => oldScene.remove(), 1200); // Iets langer wachten voor smooth transition
            }

            // Nieuwe scene toevoegen en activeren
            host.appendChild(div);
            // Korte timeout om CSS transitie te triggeren
            requestAnimationFrame(() => {
                setTimeout(() => div.classList.add('active'), 50);
            });

            // UI Updates
            document.getElementById('content-label').innerText = scene.label;
            startProgress(scene.duration * 1000);

            // Timer voor volgende scene
            clearTimeout(sceneTimer);
            sceneTimer = setTimeout(nextScene, scene.duration * 1000);
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('date').innerText = now.toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long' });
        }

        async function updateWeather() {
            try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.location.lat}&longitude=${CONFIG.location.lon}&current_weather=true`);
                const data = await res.json();
                const temp = Math.round(data.current_weather.temperature);
                document.getElementById('weather').innerText = `${CONFIG.location.city}: ${temp}°C`;
            } catch(e) {
                console.error("Weer update mislukt", e);
                // Laat oude waarde staan of doe niets
            }
        }

        function startProgress(duration) {
            const bar = document.getElementById('progress');
            bar.style.width = '0%'; // Reset
            
            const startTime = Date.now();
            clearInterval(progressInterval);
            
            progressInterval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const percentage = Math.min((elapsed / duration) * 100, 100);
                
                bar.style.width = percentage + '%';
                
                if (percentage >= 100) clearInterval(progressInterval);
            }, 50); // 20fps update is genoeg voor smooth bar
        }

        // Start de applicatie
        window.onload = init;
    </script>
</body>
</html>
