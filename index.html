<%@ Page Language="C#" %>
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Corporate Kiosk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
        
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            overflow: hidden; background: #000; 
            font-family: 'Inter', sans-serif; color: white;
        }

        /* Scenes vloeien in elkaar over */
        .scene { 
            position: absolute; inset: 0; opacity: 0; 
            transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1); 
            z-index: 1; pointer-events: none;
        }
        .scene.active { opacity: 1; pointer-events: auto; z-index: 2; }

        iframe, video { width: 100%; height: 100%; border: none; object-fit: cover; }

        /* UI Elementen */
        .overlay { 
            position: fixed; inset: 0; z-index: 10; 
            pointer-events: none; display: flex; flex-direction: column; 
            justify-content: space-between; padding: 40px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, transparent 20%, transparent 80%, rgba(0,0,0,0.7) 100%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px; padding: 20px 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Nieuws Ticker */
        .ticker-container {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px);
            padding: 14px 0; border-top: 3px solid #3b82f6; z-index: 20;
        }

        .ticker-text {
            display: inline-block; white-space: nowrap;
            padding-left: 100%; animation: ticker 40s linear infinite;
            font-weight: 700; font-size: 1.3rem; text-transform: uppercase; letter-spacing: 2px;
            color: #f8fafc;
        }

        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        .progress-bar {
            position: fixed; top: 0; left: 0; height: 6px;
            background: #3b82f6; transition: width 0.1s linear; z-index: 100;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.9);
        }
    </style>
</head>
<body>

    <div id="scene-host"></div>

    <div class="overlay">
        <!-- Top Sectie: Klok en Status -->
        <div class="flex justify-between items-start">
            <div class="glass-card flex items-center gap-8">
                <div>
                    <div id="clock" class="text-5xl font-black tracking-tighter leading-none">00:00</div>
                    <div id="date" class="text-xs uppercase font-bold opacity-60 mt-1 tracking-widest">Laden...</div>
                </div>
                <div class="h-12 w-px bg-white/20"></div>
                <div id="weather" class="text-2xl font-light">Laden...</div>
            </div>
            
            <div class="glass-card flex flex-col items-end">
                <div class="text-[10px] uppercase opacity-50 font-black tracking-[0.2em] mb-2">Huidige Presentatie</div>
                <div class="flex items-center gap-3">
                    <span class="relative flex h-3 w-3">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-blue-500"></span>
                    </span>
                    <span class="text-xl font-black uppercase tracking-tighter" id="content-label">Initialiseren...</span>
                </div>
            </div>
        </div>

        <!-- Optioneel: Bedrijfslogo Branding (Linksonder boven de ticker) -->
        <div class="mb-12">
            <div class="glass-card inline-block border-l-4 border-l-blue-500">
                <span class="text-sm font-bold opacity-40 uppercase tracking-widest block mb-1">Corporate Hub</span>
                <span class="text-2xl font-black">Celik27</span>
            </div>
        </div>
    </div>

    <div class="ticker-container">
        <div class="ticker-text" id="ticker-content">+++ WELKOM +++ LIVE DASHBOARDS +++ BEDRIJFSNIEUWS +++</div>
    </div>

    <div class="progress-bar" id="progress"></div>

    <script>
        // --- CONFIGURATIE: PAS DIT AAN ---
        const CONFIG = {
            scenes: [
                { 
                    type: 'pbi', 
                    label: 'ICT Dashboard',
                    // Gebruik de link via Bestand > Rapport insluiten > Website of portal
                    url: 'PLAK_HIER_JE_POWERBI_LINK', 
                    duration: 60 // seconden
                },
                { 
                    type: 'video', 
                    label: 'Bedrijfsvideo',
                    // Kan een YouTube link zijn of een direct .mp4 pad
                    url: 'https://www.youtube.com/watch?v=-s8g4dpmW0k', 
                    duration: 45 
                }
            ],
            ticker: "+++ NIEUWS: Welkom bij de nieuwe Corporate Kiosk +++ Bekijk de laatste KPI's op de voet +++ Vergeet niet de uren in te vullen voor vrijdag +++",
            location: { lat: 52.3676, lon: 4.9041, city: 'Amsterdam' }
        };

        let currentIdx = -1;
        let timer;
        let progressInterval;

        function init() {
            updateClock();
            updateWeather();
            document.getElementById('ticker-content').innerText = CONFIG.ticker;
            setInterval(updateClock, 1000);
            setInterval(updateWeather, 600000); // 10 min refresh
            
            nextScene();
        }

        function nextScene() {
            currentIdx = (currentIdx + 1) % CONFIG.scenes.length;
            renderScene(CONFIG.scenes[currentIdx]);
        }

        function renderScene(scene) {
            const host = document.getElementById('scene-host');
            const duration = scene.duration * 1000;

            const div = document.createElement('div');
            div.className = 'scene';
            
            // Video Logica (YouTube vs Direct)
            if (scene.type === 'video') {
                if (scene.url.includes('youtube.com') || scene.url.includes('youtu.be')) {
                    const vidId = scene.url.split('v=')[1]?.split('&')[0] || scene.url.split('/').pop();
                    div.innerHTML = `<iframe src="https://www.youtube.com/embed/${vidId}?autoplay=1&mute=1&controls=0&loop=1&playlist=${vidId}"></iframe>`;
                } else {
                    div.innerHTML = `<video src="${scene.url}" autoplay muted loop playsinline></video>`;
                }
            } else {
                // Werkt voor Power BI en andere iFrames
                div.innerHTML = `<iframe src="${scene.url}" allowFullScreen="true"></iframe>`;
            }

            // Overgangsanimatie
            const active = host.querySelector('.scene.active');
            if(active) {
                active.classList.remove('active');
                setTimeout(() => active.remove(), 2000);
            }

            host.appendChild(div);
            setTimeout(() => div.classList.add('active'), 100);

            // UI Label update
            document.getElementById('content-label').innerText = scene.label;
            startProgress(duration);

            clearTimeout(timer);
            timer = setTimeout(nextScene, duration);
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('date').innerText = now.toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long' });
        }

        async function updateWeather() {
            try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.location.lat}&longitude=${CONFIG.location.lon}&current_weather=true`);
                const data = await res.json();
                const temp = Math.round(data.current_weather.temperature);
                document.getElementById('weather').innerText = `${CONFIG.location.city}: ${temp}°C`;
            } catch(e) {
                document.getElementById('weather').innerText = CONFIG.location.city;
            }
        }

        function startProgress(ms) {
            const bar = document.getElementById('progress');
            let start = Date.now();
            clearInterval(progressInterval);
            progressInterval = setInterval(() => {
                let perc = ((Date.now() - start) / ms) * 100;
                bar.style.width = Math.min(perc, 100) + '%';
                if(perc >= 100) clearInterval(progressInterval);
            }, 50);
        }

        window.onload = init;
    </script>
</body>
</html>
